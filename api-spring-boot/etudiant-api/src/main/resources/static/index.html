<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Académique</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu-container {
            background: white;
            border-radius: 32px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1e2a5e, #4f46e5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p { color: #64748b; margin-bottom: 2rem; }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .btn-primary:hover { background: #4338ca; transform: translateY(-2px); }
        .btn-secondary {
            background: #f1f5f9;
            color: #1e293b;
        }
        .btn-secondary:hover { background: #e2e8f0; transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="menu-container">
    <h1>📚 Gestion Académique</h1>
    <p>Choisissez une section à gérer</p>
    <div class="btn-group">
        <a href="etudiants.html" class="btn btn-primary">👩‍🎓 Étudiants</a>
        <a href="departements.html" class="btn btn-secondary">🏛️ Départements</a>
    </div>
</div>
</body>
</html>
